# Generate a concise AI-written GitHub release draft for every semver tag.
# The draft groups related commits and includes only user-facing Features and Bug Fixes.
#
# Repository variables:
# - OPENCODE_VERSION: pinned OpenCode version accepted by https://opencode.ai/install
# - RELEASE_NOTES_MODEL: full provider/model ID shown by `opencode models`
#
# Repository secret:
# - OPENCODE_GO_API_KEY: API key used by the opencode-go provider in
#   .opencode/release-notes.json

name: Generate release draft

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semver tag to draft (for example v0.6.0)
        required: true
        type: string
      overwrite_existing_draft:
        description: Replace the body of an existing draft release
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: release-draft-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-draft:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      TARGET_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_TAG }}
          fetch-depth: 0

      - name: Resolve release range
        id: release_range
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$TARGET_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag must be semver-like, got: $TARGET_TAG"
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/tags/$TARGET_TAG" >/dev/null; then
            echo "::error::Tag does not exist: $TARGET_TAG"
            exit 1
          fi

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$TARGET_TAG" != "v$PACKAGE_VERSION" && "$TARGET_TAG" != "$PACKAGE_VERSION" ]]; then
            echo "::error::Tag $TARGET_TAG does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

          PREVIOUS_REF="$(
            git tag --merged "$TARGET_TAG" --sort=-v:refname \
              | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+' \
              | grep -Fxv "$TARGET_TAG" \
              | head -1 || true
          )"
          if [[ -z "$PREVIOUS_REF" ]]; then
            IS_INITIAL="true"
            echo "::notice::No earlier semver tag found; this is an initial release"
          else
            IS_INITIAL="false"
          fi

          echo "previous_ref=$PREVIOUS_REF" >> "$GITHUB_OUTPUT"
          echo "is_initial=$IS_INITIAL" >> "$GITHUB_OUTPUT"
          echo "target_tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"
          {
            echo "## Release draft range"
            echo "- Initial release: \`$IS_INITIAL\`"
            if [[ -n "$PREVIOUS_REF" ]]; then
              echo "- Previous ref: \`$PREVIOUS_REF\`"
            fi
            echo "- Target tag: \`$TARGET_TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install pinned OpenCode
        env:
          OPENCODE_VERSION: ${{ vars.OPENCODE_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$OPENCODE_VERSION" ]]; then
            echo "::error::Set the OPENCODE_VERSION repository variable"
            exit 1
          fi

          curl -fsSL https://opencode.ai/install | bash -s -- --version "$OPENCODE_VERSION"

          if command -v opencode >/dev/null 2>&1; then
            OPENCODE_DIR="$(dirname "$(command -v opencode)")"
          elif [[ -x "$HOME/.opencode/bin/opencode" ]]; then
            OPENCODE_DIR="$HOME/.opencode/bin"
          elif [[ -x "$HOME/.local/bin/opencode" ]]; then
            OPENCODE_DIR="$HOME/.local/bin"
          else
            echo "::error::OpenCode installer completed but no executable was found"
            exit 1
          fi
          echo "$OPENCODE_DIR" >> "$GITHUB_PATH"

      - name: Generate and validate concise release notes
        env:
          RELEASE_NOTES_MODEL: ${{ vars.RELEASE_NOTES_MODEL }}
          OPENCODE_CONFIG: ${{ github.workspace }}/.opencode/release-notes.json
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_NOTES_MODEL" ]]; then
            echo "::error::Set RELEASE_NOTES_MODEL to a full provider/model ID"
            exit 1
          fi
          if [[ -z "$OPENCODE_GO_API_KEY" ]]; then
            echo "::error::Set the OPENCODE_GO_API_KEY repository secret"
            exit 1
          fi

          GENERATE_ARGS=(
            --repository "$GITHUB_REPOSITORY"
            --target-ref "${{ steps.release_range.outputs.target_tag }}"
            --target-tag "${{ steps.release_range.outputs.target_tag }}"
          )
          if [[ "${{ steps.release_range.outputs.is_initial }}" == "true" ]]; then
            GENERATE_ARGS+=(--initial)
          else
            GENERATE_ARGS+=(--previous-ref "${{ steps.release_range.outputs.previous_ref }}")
          fi
          python -m scripts.release_notes.generate "${GENERATE_ARGS[@]}"

      - name: Create or update concise draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OVERWRITE_EXISTING_DRAFT: ${{ inputs.overwrite_existing_draft == true }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES_FILE=".release-notes/RELEASE_NOTES_${TARGET_TAG}.md"
          if [[ ! -s "$NOTES_FILE" ]]; then
            echo "::error::Validated release notes file is missing or empty: $NOTES_FILE"
            exit 1
          fi

          TITLE="$(head -1 "$NOTES_FILE" | sed 's/^# //')"
          BODY_FILE="${NOTES_FILE}.body"
          tail -n +2 "$NOTES_FILE" > "$BODY_FILE"

          if IS_DRAFT="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TARGET_TAG}" --jq '.draft' 2>/dev/null
          )"; then
            if [[ "$IS_DRAFT" != "true" ]]; then
              echo "::error::Release $TARGET_TAG is already published; refusing to overwrite it"
              exit 1
            fi
            if [[ "$OVERWRITE_EXISTING_DRAFT" != "true" ]]; then
              echo "Draft $TARGET_TAG already exists; leaving its potentially edited body unchanged."
              exit 0
            fi
            gh release edit "$TARGET_TAG" --title "$TITLE" --notes-file "$BODY_FILE"
          else
            EXTRA_FLAGS=()
            if [[ "$TARGET_TAG" == *-* ]]; then
              EXTRA_FLAGS+=(--prerelease)
            fi
            gh release create "$TARGET_TAG" \
              --verify-tag \
              --draft \
              "${EXTRA_FLAGS[@]}" \
              --title "$TITLE" \
              --notes-file "$BODY_FILE"
          fi

          echo "Draft ready: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-notes-${{ env.TARGET_TAG }}
          path: .release-notes/
          if-no-files-found: ignore
          retention-days: 14
