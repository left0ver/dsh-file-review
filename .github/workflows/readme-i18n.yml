name: README translation consistency

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-readme-pair:
    name: Verify bilingual README pair
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify README pair in pull request
        if: github.event_name == 'pull_request'
        run: npm run check:readme-i18n -- --base "${{ github.event.pull_request.base.sha }}"

      - name: Verify README pair
        if: github.event_name != 'pull_request'
        run: npm run check:readme-i18n
